app:
  name: tidbcluster
  code: tidbcluster
  notify: appzdev@cloudbourne.co

build:
  version: 8.5
  env: DEV
  build_file: none
  output_files: output/*.zip
  image_template: tidbcluster-8.5

deploy:
  context: arjun-cc/DEV
  type: statefulset
  replicas: 8
  port:
    - 2379    # PD client
    - 2380    # PD peer
    - 20160   # TiKV
    - 20180   # TiKV status
    - 4000    # TiDB SQL
    - 10080   # TiDB status

volumes:
  - claim: tidbcluster-data
    class: microk8s-hostpath
    mount: /appz/data
    name: data
    size: 10Gi

properties:
  TIDB_ROOT_PASSWORD:
    vault: TIDB_ROOT_PASSWORD_KEY
  PD_REPLICAS: 3
  TIKV_REPLICAS: 3
  TIDB_REPLICAS: 2
  NODE_PREFIX: "tidbcluster-8-5-"
  NODE_SUFFIX: ".tidbcluster-8-5.arjun-cc-dev.svc.cluster.local"
  PD_CLIENT_PORT: 2379
  PD_PEER_PORT: 2380
  TIKV_PORT: 20160
  TIKV_STATUS_PORT: 20180
  TIDB_PORT: 4000
  TIDB_STATUS_PORT: 10080

  revision: 6
